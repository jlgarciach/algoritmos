project:
  type: book
  output-dir: docs
  
book:
  title: "Algoritmos"
  subtitle: "De la lógica a la programación"
  author: ""
  date: ""
  language: es
  chapters:
    - index.qmd
    - capitulos/01_introduccion.qmd
    - capitulos/02_primeros_pasos_cpp.qmd
    - capitulos/Laboratorio_01_Desarrollo_de_una_Solucion.qmd
    - capitulos/03_expresiones_logicas_estructuras_condicionales.qmd
    - capitulos/04-laboratorio-ciclos-enum-cajero.qmd
    - capitulos/99_cierre.qmd
  page-footer:
    left: "Editorial Académica de Ingeniería en Sistemas"
    center: "Diseñar una vez. Enseñar toda la vida."
    right: "Ing. Jorge Luis García Chacón"

lang: es

format:
  html:
    theme:
      - cosmo
      - ../../editorial/scss/editorial.scss
    toc: true
    toc-depth: 3
    number-sections: true
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
    page-layout: article
  pdf:
    documentclass: scrbook
    papersize: letter
    toc: true
    toc-title: "Contenido"
    number-sections: true
    colorlinks: true
    pdf-engine: xelatex
    geometry:
      - top=2.4cm
      - bottom=2.4cm
      - left=2.6cm
      - right=2.4cm
    mainfont: "Arial"
    monofont: "Courier New"
    include-in-header: ../../editorial/templates/header.tex

execute:
  echo: false
  warning: false
  message: false

editor: visual
