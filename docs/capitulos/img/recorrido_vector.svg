<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
<rect width="1200" height="360" fill="white"/>
<text x="40" y="48" font-family="Arial" font-size="30" font-weight="bold" fill="#333">Recorrer significa visitar cada posición</text>
<g font-family="Arial" font-size="22" text-anchor="middle">
<text x="120" y="120" fill="#646464">i = 0</text><text x="310" y="120" fill="#646464">i = 1</text><text x="500" y="120" fill="#646464">i = 2</text><text x="690" y="120" fill="#646464">...</text><text x="880" y="120" fill="#646464">i = 9</text>
<rect x="70" y="150" width="100" height="70" rx="8" fill="#eef8f6" stroke="#319f90"/><text x="120" y="194">0</text>
<rect x="260" y="150" width="100" height="70" rx="8" fill="#eef8f6" stroke="#319f90"/><text x="310" y="194">2</text>
<rect x="450" y="150" width="100" height="70" rx="8" fill="#eef8f6" stroke="#319f90"/><text x="500" y="194">4</text>
<rect x="640" y="150" width="100" height="70" rx="8" fill="#f8f8f8" stroke="#646464"/><text x="690" y="194">...</text>
<rect x="830" y="150" width="100" height="70" rx="8" fill="#eef8f6" stroke="#319f90"/><text x="880" y="194">18</text>
<path d="M170 185 L250 185" stroke="#d35400" stroke-width="5"/><polygon points="250,185 230,173 230,197" fill="#d35400"/>
<path d="M360 185 L440 185" stroke="#d35400" stroke-width="5"/><polygon points="440,185 420,173 420,197" fill="#d35400"/>
